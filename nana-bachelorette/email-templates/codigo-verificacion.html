<div style="background: linear-gradient(160deg, #fff5f9 0%, #f3f0ff 50%, #eef8ff 100%); padding: 40px 20px; font-family: 'Segoe UI', Arial, sans-serif;">
  <div style="max-width: 420px; margin: 0 auto; background: #ffffff; border-radius: 28px; padding: 36px 28px; text-align: center; box-shadow: 0 10px 30px rgba(255,143,199,0.25); border: 1px solid #ffe1ef;">

    <div style="width: 64px; height: 64px; line-height: 64px; border-radius: 50%; background: linear-gradient(135deg, #ff8fc7, #b9a2f2); margin: 0 auto 16px; font-size: 28px; text-align: center;">
      🔐
    </div>

    <h1 style="color:#5b3a56; font-size: 20px; margin: 0 0 8px; font-weight: 800;">
      ¡Hola, {{to_name}}! ✨
    </h1>

    <p style="color:#8a6b86; font-size: 14px; line-height: 1.5; margin: 0 0 24px;">
      Este es tu código para confirmar que eres tú en la fiesta de<br />
      <strong style="color:#5b3a56;">Despedida de Soltera de Mirna 🎤</strong>
    </p>

    <div style="background: linear-gradient(135deg, #ffd6e8, #e4d6ff); border-radius: 16px; padding: 18px; margin-bottom: 24px;">
      <span style="font-size: 34px; font-weight: 800; letter-spacing: 10px; color:#5b3a56;">
        {{codigo}}
      </span>
    </div>

    <p style="color:#8a6b86; font-size: 12px; margin: 0; line-height: 1.5;">
      Este código vence en 10 minutos.<br />
      Si tú no lo pediste, ignora este correo 💗
    </p>

  </div>

  <p style="text-align:center; color:#b998c9; font-size: 11px; margin-top: 20px;">
    Hecho con 💗 para la futura esposa
  </p>
</div>
